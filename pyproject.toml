[project]
name = "dynasty-agent"
version = "0.1.0"
description = "Dynasty fantasy football agent for a 12-team Sleeper league"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
dynasty-agent = "dynasty_agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]
# Only for `dynasty-agent finetune train`. On an NVIDIA GPU install the CUDA build of torch first (pytorch.org).
finetune = [
    "torch",
    "transformers>=5",
    "peft",
    "trl",
    "datasets",
    "accelerate",
    "bitsandbytes",
    "sentencepiece",
]
